name: Flatpak CI & Packaging

on:
  push:
    branches: [ main, "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Test Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev libpulse0 python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1
          echo "PYTHONPATH=/usr/lib/python3/dist-packages" >> $GITHUB_ENV

      - name: Run Test Suite
        run: |
          python3 tests/test_archive.py
          python3 tests/test_player.py
          python3 tests/test_overview_minimap.py
          python3 tests/test_timeline_canvas.py

  flatpak-builder:
    name: Build Flatpak Bundle
    needs: test
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-nightly
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Application
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: tech.redfoxlabs.Pianola.flatpak
          manifest-path: tech.redfoxlabs.Pianola.json
          cache-key: flatpak-builder-${{ github.sha }}
          run-tests: false

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tech.redfoxlabs.Pianola.flatpak
          path: tech.redfoxlabs.Pianola.flatpak
          if-no-files-found: error
          retention-days: 14

      - name: Export OCI Image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          echo "Exporting Flatpak OCI image..."
          flatpak build-bundle --oci repo tech.redfoxlabs.Pianola.oci tech.redfoxlabs.Pianola

      - name: Upload OCI Image Artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: tech.redfoxlabs.Pianola.oci
          path: tech.redfoxlabs.Pianola.oci
          if-no-files-found: error
          retention-days: 7

  publish-oci:
    name: Publish OCI Image to GHCR
    needs: flatpak-builder
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download OCI Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: tech.redfoxlabs.Pianola.oci
          path: tech.redfoxlabs.Pianola.oci

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Publish to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login -u "${{ github.actor }}" --password-stdin ghcr.io
          IMAGE_TAG="latest"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            IMAGE_TAG="${GITHUB_REF#refs/tags/v}"
          fi
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "Publishing OCI image tag: ${IMAGE_TAG}"
          skopeo copy oci:tech.redfoxlabs.Pianola.oci "docker://ghcr.io/${OWNER}/pianola:${IMAGE_TAG}"
          if [[ "${IMAGE_TAG}" != "latest" ]]; then
            skopeo copy oci:tech.redfoxlabs.Pianola.oci "docker://ghcr.io/${OWNER}/pianola:latest" || true
          fi

  release:
    name: Publish GitHub Release
    needs: flatpak-builder
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Flatpak Bundle
        uses: actions/download-artifact@v4
        with:
          name: tech.redfoxlabs.Pianola.flatpak
          path: ./

      - name: Create GitHub Release and Attach Bundle
        uses: softprops/action-gh-release@v2
        with:
          files: tech.redfoxlabs.Pianola.flatpak
          generate_release_notes: true
