<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- Paper Gradient -->
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="40%" stop-color="#F7F1E5"/>
      <stop offset="85%" stop-color="#EDE3D0"/>
      <stop offset="100%" stop-color="#DFD4BE"/>
    </linearGradient>

    <!-- Spool Flange Brass Gradient -->
    <linearGradient id="brass-flange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C68A00"/>
      <stop offset="30%" stop-color="#F6D32D"/>
      <stop offset="70%" stop-color="#F5C211"/>
      <stop offset="100%" stop-color="#996800"/>
    </linearGradient>

    <!-- Spool Cylinder Gradient -->
    <linearGradient id="spool-cylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5E3516"/>
      <stop offset="25%" stop-color="#865223"/>
      <stop offset="60%" stop-color="#633A19"/>
      <stop offset="100%" stop-color="#3D210D"/>
    </linearGradient>

    <!-- Paper Roll Curl Shadow -->
    <linearGradient id="top-curl-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Perforation Hole Color -->
    <linearGradient id="punch-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18151D"/>
      <stop offset="100%" stop-color="#282330"/>
    </linearGradient>
  </defs>

  <!-- Ambient Shadow for Whole Object -->
  <g filter="url(#shadow)">
    <!-- Paper Roll Sheet Body with Tapered Leader -->
    <path d="M 26 24
             L 102 24
             L 102 88
             L 64 114
             L 26 88
             Z"
          fill="url(#paper-grad)"
          stroke="#C7BAA2"
          stroke-width="1"
          stroke-linejoin="round"/>
  </g>

  <!-- Paper Inner Top Shadow under spool -->
  <rect x="26" y="24" width="76" height="8" fill="url(#top-curl-shadow)"/>

  <!-- Left/Right Paper Margins (vintage roll marginal score lines) -->
  <line x1="30" y1="26" x2="30" y2="86" stroke="#D9CEBB" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="98" y1="26" x2="98" y2="86" stroke="#D9CEBB" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Tracker Line (Pianola Playhead bar across roll) -->
  <rect x="25.5" y="58" width="77" height="2.5" fill="#E01B24" opacity="0.88" rx="0.5"/>
  <line x1="26" y1="59.25" x2="102" y2="59.25" stroke="#FF7800" stroke-width="0.6" opacity="0.7"/>

  <!-- Punched Note Perforations -->
  <g fill="url(#punch-fill)">
    <!-- Melody & Chord punch tracks -->
    <!-- Column 1 -->
    <rect x="34" y="33" width="3.5" height="12" rx="1.75"/>
    <rect x="34" y="68" width="3.5" height="8" rx="1.75"/>

    <!-- Column 2 -->
    <rect x="41" y="42" width="3.5" height="5" rx="1.75"/>
    <rect x="41" y="52" width="3.5" height="14" rx="1.75"/>

    <!-- Column 3 -->
    <rect x="48" y="30" width="3.5" height="19" rx="1.75"/>
    <rect x="48" y="72" width="3.5" height="4" rx="1.75"/>

    <!-- Column 4 (Overlapping tracker) -->
    <rect x="55" y="46" width="3.5" height="18" rx="1.75"/>

    <!-- Column 5 (Bass line / long sustain) -->
    <rect x="62" y="35" width="3.5" height="28" rx="1.75"/>
    <rect x="62" y="69" width="3.5" height="9" rx="1.75"/>

    <!-- Column 6 -->
    <rect x="69" y="54" width="3.5" height="15" rx="1.75"/>

    <!-- Column 7 -->
    <rect x="76" y="32" width="3.5" height="7" rx="1.75"/>
    <rect x="76" y="44" width="3.5" height="10" rx="1.75"/>
    <rect x="76" y="71" width="3.5" height="6" rx="1.75"/>

    <!-- Column 8 -->
    <rect x="83" y="38" width="3.5" height="24" rx="1.75"/>

    <!-- Column 9 -->
    <rect x="90" y="49" width="3.5" height="8" rx="1.75"/>
    <rect x="90" y="63" width="3.5" height="11" rx="1.75"/>
  </g>

  <!-- Brass Eyelet / Pull Ring on Leader Point -->
  <g filter="url(#shadow)">
    <circle cx="64" cy="105" r="4.5" fill="url(#brass-flange)" stroke="#996800" stroke-width="0.8"/>
    <circle cx="64" cy="105" r="2.2" fill="#BFAFA0" stroke="#785400" stroke-width="0.6"/>
  </g>

  <!-- Top Spool Assembly -->
  <!-- Spool Cylinder Body -->
  <rect x="18" y="16" width="92" height="13" rx="3" fill="url(#spool-cylinder)" stroke="#2D1809" stroke-width="0.8"/>
  <!-- Spool Cylinder Highlight -->
  <line x1="22" y1="17.5" x2="106" y2="17.5" stroke="#B5773A" stroke-width="0.8" opacity="0.6"/>

  <!-- Left Flange (Brass endcap wheel) -->
  <rect x="15" y="13" width="7" height="19" rx="2.5" fill="url(#brass-flange)" stroke="#785400" stroke-width="0.8"/>
  <circle cx="18.5" cy="22.5" r="1.8" fill="#F6D32D" stroke="#996800" stroke-width="0.6"/>

  <!-- Right Flange (Brass endcap wheel) -->
  <rect x="106" y="13" width="7" height="19" rx="2.5" fill="url(#brass-flange)" stroke="#785400" stroke-width="0.8"/>
  <circle cx="109.5" cy="22.5" r="1.8" fill="#F6D32D" stroke="#996800" stroke-width="0.6"/>

  <!-- Paper curl highlight where paper leaves the roll -->
  <line x1="26" y1="24.5" x2="102" y2="24.5" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>
</svg>
